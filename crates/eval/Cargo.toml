[package]
name = "freesynth-eval"
description = "Quality metrics and paired comparisons for FreeSynth syntheses"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "freesynth-eval"
path = "src/main.rs"

[dependencies]
freesynth-core = { version = "0.1.0", path = "../core" }
rayon = { version = "1.12.0", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[dev-dependencies]
freesynth-scenes = { version = "0.1.0", path = "../scenes" }
