[package]
name = "freesynth"
description = "FreeSynth library: projects, render sessions, incremental re-rendering, video I/O, progress and cancellation for keyframe video stylization"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["gpu"]
# Render on the GPU (wgpu). Without it every render runs on the CPU.
gpu = ["freesynth-video/gpu", "dep:freesynth-gpu", "dep:pollster", "dep:wgpu"]

[dependencies]
blake3 = { version = "1.8.2", default-features = false, features = ["std", "pure"] }
freesynth-core = { version = "0.1.0", path = "../core" }
freesynth-gpu = { version = "0.1.0", path = "../gpu", optional = true }
freesynth-media = { version = "0.1.0", path = "../media" }
freesynth-video = { version = "0.1.0", path = "../video", default-features = false }
pollster = { version = "1.0.1", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.152"
toml = "1.1.6"
wgpu = { version = "30.0.1", optional = true }

[dev-dependencies]
freesynth-scenes = { version = "0.1.0", path = "../scenes" }
